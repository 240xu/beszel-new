name: Tests

# The gate exists because `make test` was good and entirely unenforced: six workflows, zero of
# which ever ran it. Nothing here duplicates what the Makefile already knows how to do -- these
# steps install toolchains and then hand off to it. Anything re-typed by hand (a bare `go test`,
# a narrower `make test-go`) is exactly the drift the drift guard below exists to catch.

on:
  pull_request:
  push:
    branches:
        # beszel-new is this fork's default branch; main is kept so the
        # gate still holds if the branch is ever renamed back.
      - main
      - beszel-new

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: make test (go + site)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Reads the `go` directive out of go.mod rather than pinning a version here, so a Go
      # bump cannot leave this workflow silently testing an older toolchain than the module
      # asks for.
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # vite 7 refuses to run on anything older than node 20.19, and the type check, the
      # linter, the catalog compiler and the bundle are all node tools now. 22 is the
      # current LTS and is comfortably inside what vite supports.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: internal/site/package-lock.json

      # setup-bun puts bun on PATH through GITHUB_PATH. That is the whole fix for the bug that
      # started this: bun installs into ~/.bun/bin, which is off PATH for every non-interactive
      # shell, so 204 frontend tests once went unrun on a build that still reported success.
      - name: Set up bun
        uses: oven-sh/setup-bun@v2

      # Assert the runners are real rather than trusting the installer. A missing toolchain has
      # to be a red setup step; it must never become a gate that ran nothing.
      - name: Verify toolchains
        run: |
          set -euo pipefail
          command -v go >/dev/null || { echo "go is not on PATH" >&2; exit 1; }
          go version
          command -v node >/dev/null || { echo "node is not on PATH" >&2; exit 1; }
          node --version
          command -v npm >/dev/null || { echo "npm is not on PATH" >&2; exit 1; }
          npm --version
          command -v bun >/dev/null || { echo "bun is not on PATH" >&2; exit 1; }
          bun --version

      - name: Install site dependencies
        run: bun install --cwd ./internal/site

      # internal/site/embed.go carries `//go:embed all:dist` while internal/site/dist is
      # gitignored. On a fresh checkout that combination means `go test ./...` cannot compile:
      # ten packages fail with "pattern all:dist: no matching files found". The Makefile
      # already knows this -- its own build-hub-dev target plants exactly this stub -- so this
      # is not a new convention, it is the one the Makefile uses. No test reads the bundle
      # (internal/tests/api.go nils ui.DistDirFS out rather than loading it), so a stub keeps
      # the suite honest instead of turning the test gate into a site build. Whether that embed
      # should require a build artifact before the Go tests can compile at all is a real
      # question, and it is not this workflow's to answer; what is this workflow's job is to
      # fail loudly rather than quietly skip, which deleting this step does immediately.
      - name: Seed the embedded site directory
        run: |
          mkdir -p ./internal/site/dist
          touch ./internal/site/dist/index.html

      # Cheap, and it fails loudly if this file and the Makefile ever stop describing the same
      # gate. Runs first so the failure names the drift instead of surfacing as a mystery test
      # failure later.
      - name: Guard against workflow/Makefile drift
        run: make ci-gate-drift

      # The one command that matters. It is `test: test-build test-go test-site`, with no valve, so it
      # cannot exit 0 with either suite unrun.
      #
      # `make test-site` is now more than the bun suite: it also compiles the catalogs, checks
      # them against the source, type checks the tree, lints it against a recorded baseline and
      # audits the dependencies. None of those is a valve; each one fails the build.
      - name: Run the gate
        run: make test

  verify:
    name: frontend bundle + go lint
    runs-on: ubuntu-latest
    # The bundle build takes minutes and the Go linters take minutes to install. They are
    # gates, but they are not on the critical path of a review, so they get their own job and
    # run beside the gate rather than inside it.
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: internal/site/package-lock.json

      - name: Set up bun
        uses: oven-sh/setup-bun@v2

      - name: Install site dependencies
        run: bun install --cwd ./internal/site

      # The linters are pinned, and the pin is load-bearing: staticcheck 2025.1.1 (v0.6.1)
      # cannot read go1.27 export data and aborts before it reaches a project file, which
      # looks exactly like a clean run. v0.8.2 (2026.2.2) can.
      - name: Install the Go linters
        run: |
          set -euo pipefail
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
          staticcheck -version
          golangci-lint --version

      # The production bundle, built the way `go:embed` will ship it. A bundle that does not
      # build is a release that does not start, and nothing else in this workflow would say so.
      - name: Build the production bundle
        run: make site-bundle

      # staticcheck and golangci-lint, both against a recorded baseline: a finding that is new
      # fails, a finding that is already recorded does not.
      - name: Run the Go linters
        run: make lint-go

  # The release matrix in .goreleaser.yml ships targets the ubuntu gate never
  # compiles, so a build-tag mistake (envOr declared in a linux-only file, sqlite
  # with no mips port) reached a release run instead of a review. This job builds
  # the shipped targets without running their tests: cross-arch tests cannot run
  # here, and the point is that the code compiles for what we ship.
  cross-build:
    name: cross-build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: linux, goarch: arm, goarm: "7" }
          - { goos: linux, goarch: mips }
          - { goos: linux, goarch: mipsle }
          - { goos: linux, goarch: mips64 }
          - { goos: linux, goarch: riscv64 }
          - { goos: linux, goarch: ppc64le }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: freebsd, goarch: amd64 }
          - { goos: freebsd, goarch: arm64 }
          - { goos: openbsd, goarch: amd64 }
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      # The hub embeds the built site, so the package graph needs a file there
      # even when only the agent is compiled. The agent binary itself does not.
      - name: Seed the embedded site directory
        run: |
          mkdir -p ./internal/site/dist
          printf '<!doctype html><html></html>' > ./internal/site/dist/index.html
      - name: Build the agent for this target
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
        run: go build -trimpath -o /dev/null ./internal/cmd/agent
      # The hub is only released for amd64/arm64/arm (.goreleaser.yml), and its
      # sqlite dependency has no mips port, so building it for every agent target
      # would fail on a combination we never ship.
      - name: Build the hub for this target
        if: ${{ matrix.goarch == 'amd64' || matrix.goarch == 'arm64' || matrix.goarch == 'arm' }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
        run: go build -trimpath -o /dev/null ./internal/cmd/hub

  # Windows is split out because the agent embeds a .NET helper that has to be
  # built first; a plain go build fails on the missing embed tree, which is a
  # real release step and belongs in the matrix rather than being skipped.
  cross-build-windows:
    name: cross-build (windows/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "9.0.x"
      - name: Build the embedded LHM helper
        run: dotnet build -c Release ./agent/lhm/beszel_lhm.csproj
      # The Windows agent also embeds smartctl.exe. It is fetched at build time with
      # a pinned SHA (agent/smart.go), which is exactly what the release does, so the
      # matrix exercises the real acquisition path instead of stubbing it.
      - name: Fetch the embedded smartctl.exe
        run: go generate -run fetchsmartctl ./agent
      - name: Seed the embedded site directory
        run: |
          mkdir -p ./internal/site/dist
          printf '<!doctype html><html></html>' > ./internal/site/dist/index.html
      - name: Build the agent for windows
        env:
          GOOS: windows
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -o /dev/null ./internal/cmd/agent
